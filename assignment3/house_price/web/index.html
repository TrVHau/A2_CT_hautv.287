<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dự đoán Giá Nhà VN - Assignment 03</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen">
    <div class="max-w-6xl mx-auto p-6">
      <header class="mb-8 text-center border-b border-slate-800 pb-6">
        <span
          class="px-3 py-1 bg-amber-950 border border-amber-700 text-amber-300 text-xs rounded-full font-semibold uppercase tracking-wider"
        >
          Assignment 03 • Intelligent System Development
        </span>
        <h1 class="text-3xl font-bold mt-3 text-white">
          Hệ Thống Dự Đoán Giá Nhà (Regression)
        </h1>
        <p class="text-slate-400 mt-1">
          So sánh song song 4 mô hình: Ridge, Decision Tree, Random Forest &
          PyTorch MLP
        </p>
      </header>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <!-- Form Input -->
        <div
          class="lg:col-span-4 bg-slate-800/80 p-6 rounded-2xl border border-slate-700 shadow-xl backdrop-blur"
        >
          <h2
            class="text-lg font-semibold text-amber-400 mb-4 flex items-center gap-2"
          >
            <i class="fa-solid fa-house"></i> Thông số cấu trúc nhà
          </h2>

          <form id="predictForm" class="space-y-4">
            <div>
              <label class="block text-xs text-slate-400 mb-1"
                >Quận/Huyện (Hà Nội)</label
              >
              <select
                id="district"
                class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-amber-500 outline-none"
              >
                <option value="Quận Cầu Giấy">Quận Cầu Giấy</option>
                <option value="Quận Nam Từ Liêm">Quận Nam Từ Liêm</option>
                <option value="Quận Đống Đa">Quận Đống Đa</option>
                <option value="Quận Thanh Xuân">Quận Thanh Xuân</option>
                <option value="Huyện Hoài Đức">Huyện Hoài Đức</option>
                <option value="Other">Quận/Huyện khác</option>
              </select>
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">Loại hình</label>
              <select
                id="house_type"
                class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-amber-500 outline-none"
              >
                <option value="Nhà ngõ, hẻm">Nhà ngõ, hẻm</option>
                <option value="Nhà mặt phố, mặt tiền">
                  Nhà mặt phố, mặt tiền
                </option>
                <option value="Nhà biệt thự, liền kề">Biệt thự, Liền kề</option>
              </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs text-slate-400 mb-1">Số tầng</label>
                <input
                  type="number"
                  id="floors"
                  value="4"
                  class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:border-amber-500 outline-none"
                  required
                />
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1"
                  >Phòng ngủ</label
                >
                <input
                  type="number"
                  id="bedrooms"
                  value="3"
                  class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:border-amber-500 outline-none"
                  required
                />
              </div>
            </div>

            <div class="grid grid-cols-3 gap-2">
              <div>
                <label class="block text-xs text-slate-400 mb-1">Dài (m)</label>
                <input
                  type="number"
                  id="length"
                  value="10"
                  step="0.1"
                  class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:border-amber-500 outline-none"
                  required
                />
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1"
                  >Rộng (m)</label
                >
                <input
                  type="number"
                  id="width"
                  value="4.5"
                  step="0.1"
                  class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:border-amber-500 outline-none"
                  required
                />
              </div>
              <div>
                <label class="block text-xs text-amber-500 font-bold mb-1"
                  >Diện tích (m²)</label
                >
                <input
                  type="number"
                  id="area"
                  value="45"
                  class="w-full bg-slate-900 border border-amber-600 rounded-lg p-2 text-sm text-amber-300 font-bold focus:border-amber-400 outline-none"
                  required
                />
              </div>
            </div>

            <button
              type="submit"
              id="submitBtn"
              class="w-full mt-4 bg-amber-600 hover:bg-amber-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-amber-500/20 transition flex items-center justify-center gap-2"
            >
              <i class="fa-solid fa-calculator"></i> ĐỊNH GIÁ (4 MÔ HÌNH)
            </button>
          </form>
        </div>

        <!-- Result Panel -->
        <div class="lg:col-span-8 space-y-4">
          <div class="flex items-center justify-between">
            <h2
              class="text-lg font-semibold text-slate-200 flex items-center gap-2"
            >
              <i class="fa-solid fa-money-bill-wave text-amber-400"></i> Dự báo
              giá trị Bất Động Sản (Regression)
            </h2>
            <span
              id="loadingSpinner"
              class="hidden text-xs text-amber-400 flex items-center gap-2"
            >
              <i class="fa-solid fa-spinner fa-spin"></i> Đang tính toán...
            </span>
          </div>

          <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div
              class="col-span-2 bg-slate-800/40 border border-slate-700/60 p-8 rounded-2xl text-center text-slate-400"
            >
              <i
                class="fa-solid fa-arrow-left text-3xl mb-2 text-slate-500"
              ></i>
              <p>Nhập thông số nhà đất và bấm định giá.</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const modelMeta = {
        ridge: {
          title: "Ridge Regression",
          icon: "fa-chart-line",
          badge: "Linear Baseline",
        },
        decision_tree: {
          title: "Decision Tree",
          icon: "fa-tree",
          badge: "Single Tree R2=0.55",
        },
        random_forest: {
          title: "Random Forest",
          icon: "fa-cubes-stacked",
          badge: "Best ML Model R2=0.61",
        },
        pytorch_mlp: {
          title: "Deep Learning MLP",
          icon: "fa-network-wired",
          badge: "PyTorch representation",
        },
      };

      document
        .getElementById("predictForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("submitBtn");
          const spinner = document.getElementById("loadingSpinner");
          btn.disabled = true;
          spinner.classList.remove("hidden");

          const payload = {
            district: document.getElementById("district").value,
            house_type: document.getElementById("house_type").value,
            legal_status: "Đã có sổ",
            floors: parseFloat(document.getElementById("floors").value),
            bedrooms: parseFloat(document.getElementById("bedrooms").value),
            length: parseFloat(document.getElementById("length").value),
            width: parseFloat(document.getElementById("width").value),
            area: parseFloat(document.getElementById("area").value),
          };

          try {
            const res = await fetch("/predict", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            const data = await res.json();

            if (data.success) renderResults(data.results);
            else alert("Lỗi: " + data.error);
          } catch (err) {
            alert("Không kết nối được API: " + err);
          } finally {
            btn.disabled = false;
            spinner.classList.add("hidden");
          }
        });

      function renderResults(results) {
        const grid = document.getElementById("resultsGrid");
        grid.innerHTML = "";

        for (const key in results) {
          const r = results[key];
          const meta = modelMeta[key] || {
            title: key,
            icon: "fa-brain",
            badge: "Model",
          };

          const card = document.createElement("div");
          card.className = `bg-slate-800/80 border border-slate-700 p-5 rounded-2xl shadow-lg flex flex-col justify-between transition hover:border-amber-500`;

          card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-2">
                                <i class="fa-solid ${meta.icon} text-amber-400 text-base"></i>
                                <span class="font-bold text-sm text-slate-200">${meta.title}</span>
                            </div>
                            <span class="text-[10px] bg-slate-900 text-slate-400 px-2 py-0.5 rounded border border-slate-700">
                                ${meta.badge}
                            </span>
                        </div>
                        <div class="mt-4 mb-2">
                            <span class="text-xs text-slate-400 tracking-wider uppercase">Giá trị Ước tính</span>
                            <div class="text-3xl font-extrabold text-amber-400 mt-1">
                                ${r.price_billion_vnd} <span class="text-base font-medium text-amber-600/80">Tỷ VNĐ</span>
                            </div>
                            <div class="text-sm text-slate-500 mt-1">
                                (~ ${r.price_million_vnd.toLocaleString()} Triệu VNĐ)
                            </div>
                        </div>
                    </div>
                    <div class="pt-3 border-t border-slate-700/50 flex justify-between text-[11px] text-slate-500 mt-4">
                        <span>Độ trễ suy luận: <b>${r.latency_ms} ms</b></span>
                    </div>
                `;
          grid.appendChild(card);
        }
      }
    </script>
  </body>
</html>
